# Standard PiPER example; verify model, firmware, channel, and pose for your arm.
arm:
  backend: piper_joint
  model: PIPER
  firmware: V183
  channel: can0
  speed_percent: 50
  home_joints: [0.0, 1.1, -1.2, 0.0, 0.5, 0.0]
  auto_home: false
quest:
  control_hand: left
teleop:
  pos_scale: 1.0
  limits:
    max_lin_vel: 0.08
    max_ang_vel: 0.5
    max_cmd_deviation: 0.03
joint_position:
  max_joint_vel: 0.4
gripper:
  max_width: 0.07
  force: 2.0
  rate_hz: 30
cameras: []
recording:
  root: ./piper_datasets
monitor:
  host: 127.0.0.1
  port: 8780
